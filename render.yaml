services:
  - type: web
    name: f1-2026-sim
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt numba
    startCommand: python run.py
    healthCheckPath: /api/tracks
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: F1SIM_PUBLIC
        value: "1"
